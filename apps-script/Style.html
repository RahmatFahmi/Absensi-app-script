<style>
/* ==========================================================================
   DESIGN TOKENS & CSS VARIABLES
   ========================================================================== */
:root {
  /* Colors */
  --primary: #1e40af;
  --primary-hover: #1d4ed8;
  --primary-subtle: #eff6ff;
  --surface: #ffffff;
  --surface-alt: #f8fafc;
  --surface-muted: #f1f5f9;
  --surface-border: #cbd5e1;
  --border-focus: #2563eb;
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-inverse: #ffffff;

  /* Status Presensi */
  --color-hadir: #15803d;
  --bg-hadir: #dcfce7;
  --border-hadir: #86efac;

  --color-izin: #0369a1;
  --bg-izin: #e0f2fe;
  --border-izin: #7dd3fc;

  --color-sakit: #b45309;
  --bg-sakit: #fef3c7;
  --border-sakit: #fcd34d;

  --color-alpa: #b91c1c;
  --bg-alpa: #fee2e2;
  --border-alpa: #fca5a5;

  /* Status Pengajuan Izin */
  --color-wait-doc: #6b21a8;
  --bg-wait-doc: #f3e8ff;
  --border-wait-doc: #d8b4fe;

  --color-wait-appr: #854d0e;
  --bg-wait-appr: #fef9c3;
  --border-wait-appr: #fde047;

  --color-approved: #15803d;
  --bg-approved: #dcfce7;
  --border-approved: #86efac;

  --color-rejected: #9f1239;
  --bg-rejected: #ffe4e6;
  --border-rejected: #fda4af;

  /* Typography */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-xs: 0.75rem;
  --font-sm: 0.875rem;
  --font-base: 1rem;
  --font-lg: 1.125rem;
  --font-xl: 1.25rem;
  --font-2xl: 1.5rem;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);

  /* Touch & Accessibility */
  --min-target: 44px;
  --sidebar-w: 250px;
  --topbar-h: 60px;
}

/* ==========================================================================
   RESET & BASE STYLES
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family);
  font-size: var(--font-base);
  line-height: 1.5;
  color: var(--text-main);
  background-color: var(--surface-alt);
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--primary);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

/* Accessible Focus Ring */
:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}

/* Visibility & Accessibility Helper */
[hidden], .is-hidden {
  display: none !important;
}

/* ==========================================================================
   LAYOUT FRAMEWORK
   ========================================================================== */
.app-container {
  display: flex;
  min-height: 100vh;
}

/* Topbar */
.topbar {
  position: sticky;
  top: 0;
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-4);
  z-index: 30;
}

.topbar-left, .topbar-right {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.brand-title {
  font-size: var(--font-lg);
  font-weight: 700;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* Sidebar Drawer */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--surface-border);
  display: flex;
  flex-direction: column;
  z-index: 50;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar-header {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-4);
  border-bottom: 1px solid var(--surface-border);
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-3) var(--space-2);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.nav-section-title {
  font-size: var(--font-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  padding: var(--space-2) var(--space-3) var(--space-1);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-weight: 500;
  font-size: var(--font-sm);
  min-height: var(--min-target);
  border: 1px solid transparent;
  cursor: pointer;
  background: none;
  text-align: left;
  width: 100%;
}

.nav-item:hover {
  background-color: var(--surface-muted);
  text-decoration: none;
}

.nav-item.active {
  background-color: var(--primary-subtle);
  color: var(--primary);
  font-weight: 600;
  border-color: #bfdbfe;
}

.nav-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.sidebar-footer {
  padding: var(--space-4);
  border-top: 1px solid var(--surface-border);
  background: var(--surface-alt);
}

.user-badge {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: var(--primary-subtle);
  color: var(--primary);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--font-sm);
  border: 1px solid #bfdbfe;
}

.sidebar-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  z-index: 45;
  display: none;
}
.sidebar-backdrop.open {
  display: block;
}

/* Main Area */
.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  width: 100%;
}

.main-content {
  flex: 1;
  padding: var(--space-4);
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
}

@media (min-width: 1024px) {
  .sidebar {
    transform: translateX(0);
  }
  .sidebar-backdrop {
    display: none !important;
  }
  .main-wrapper {
    margin-left: var(--sidebar-w);
  }
  .menu-toggle {
    display: none !important;
  }
  .main-content {
    padding: var(--space-6);
  }
}

/* ==========================================================================
   PAGE SECTIONS (SHOW / HIDE)
   ========================================================================== */
.page {
  display: none;
}

.page:not(.active) {
  display: none !important;
}

.page.active:not([hidden]) {
  display: block;
  animation: fadeIn 0.15s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   PAGE HEADER & BREADCRUMBS
   ========================================================================== */
.page-header {
  margin-bottom: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

@media (min-width: 640px) {
  .page-header {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
}

.page-title {
  font-size: var(--font-2xl);
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.25;
}

.page-subtitle {
  font-size: var(--font-sm);
  color: var(--text-muted);
}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--min-target);
  padding: var(--space-2) var(--space-4);
  font-size: var(--font-sm);
  font-weight: 600;
  font-family: inherit;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s ease;
}
.btn:hover {
  text-decoration: none;
}

.btn-primary {
  background-color: var(--primary);
  color: var(--text-inverse);
}
.btn-primary:hover {
  background-color: var(--primary-hover);
}

.btn-secondary {
  background-color: var(--surface-muted);
  color: var(--text-main);
  border-color: var(--surface-border);
}
.btn-secondary:hover {
  background-color: #e2e8f0;
}

.btn-outline {
  background-color: transparent;
  color: var(--primary);
  border-color: var(--primary);
}
.btn-outline:hover {
  background-color: var(--primary-subtle);
}

.btn-success {
  background-color: var(--color-hadir);
  color: var(--text-inverse);
}
.btn-success:hover {
  background-color: #166534;
}

.btn-danger {
  background-color: var(--color-alpa);
  color: var(--text-inverse);
}
.btn-danger:hover {
  background-color: #991b1b;
}

.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: var(--font-xs);
}

.btn-block {
  width: 100%;
}

/* ==========================================================================
   CARDS & GRIDS
   ========================================================================== */
.card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-4);
  overflow: hidden;
}

.card-header {
  padding: var(--space-4);
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
}

.card-title {
  font-size: var(--font-lg);
  font-weight: 600;
  color: var(--text-main);
}

.card-body {
  padding: var(--space-4);
}

.card-footer {
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--surface-border);
  background: var(--surface-alt);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-2);
}

/* Metric Cards */
.grid {
  display: grid;
  gap: var(--space-4);
}
.grid-cols-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid-cols-3 {
  grid-template-columns: repeat(1, minmax(0, 1fr));
}
.grid-cols-4 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (min-width: 640px) {
  .grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (min-width: 1024px) {
  .grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

.metric-card {
  padding: var(--space-4);
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.metric-icon-box {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.metric-info {
  flex: 1;
  min-width: 0;
}

.metric-label {
  font-size: var(--font-xs);
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}

.metric-value {
  font-size: var(--font-2xl);
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.1;
}

.metric-sub {
  font-size: var(--font-xs);
  color: var(--text-muted);
  margin-top: 4px;
}

/* ==========================================================================
   FORM CONTROLS
   ========================================================================== */
.form-group {
  margin-bottom: var(--space-4);
}

.form-label {
  display: block;
  font-size: var(--font-sm);
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: var(--space-1);
}

.form-control, .form-select {
  width: 100%;
  min-height: var(--min-target);
  padding: var(--space-2) var(--space-3);
  font-size: var(--font-base);
  font-family: inherit;
  color: var(--text-main);
  background-color: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.form-control:focus, .form-select:focus {
  border-color: var(--border-focus);
  outline: none;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

textarea.form-control {
  min-height: 90px;
  resize: vertical;
}

.form-help {
  font-size: var(--font-xs);
  color: var(--text-muted);
  margin-top: var(--space-1);
}

.form-row {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

@media (min-width: 640px) {
  .form-row {
    flex-direction: row;
    align-items: center;
  }
  .form-row .form-group {
    flex: 1;
    margin-bottom: 0;
  }
}

/* ==========================================================================
   BADGES (STATUS WITH ICONS & HIGH CONTRAST)
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: var(--font-xs);
  font-weight: 700;
  border-radius: var(--radius-full);
  line-height: 1.2;
  border: 1px solid transparent;
  white-space: nowrap;
}

.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: var(--radius-full);
  background-color: currentColor;
}

.badge-hadir {
  background: var(--bg-hadir);
  color: var(--color-hadir);
  border-color: var(--border-hadir);
}

.badge-izin {
  background: var(--bg-izin);
  color: var(--color-izin);
  border-color: var(--border-izin);
}

.badge-sakit {
  background: var(--bg-sakit);
  color: var(--color-sakit);
  border-color: var(--border-sakit);
}

.badge-alpa {
  background: var(--bg-alpa);
  color: var(--color-alpa);
  border-color: var(--border-alpa);
}

.badge-wait-doc {
  background: var(--bg-wait-doc);
  color: var(--color-wait-doc);
  border-color: var(--border-wait-doc);
}

.badge-wait-appr {
  background: var(--bg-wait-appr);
  color: var(--color-wait-appr);
  border-color: var(--border-wait-appr);
}

.badge-approved {
  background: var(--bg-approved);
  color: var(--color-approved);
  border-color: var(--border-approved);
}

.badge-rejected {
  background: var(--bg-rejected);
  color: var(--color-rejected);
  border-color: var(--border-rejected);
}

.badge-sudah {
  background: var(--bg-hadir);
  color: var(--color-hadir);
  border-color: var(--border-hadir);
}

.badge-belum {
  background: var(--surface-muted);
  color: var(--text-muted);
  border-color: var(--surface-border);
}

/* ==========================================================================
   RESPONSIVE TABLES
   ========================================================================== */
.table-container {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-4);
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-sm);
  text-align: left;
}

.table th {
  background: var(--surface-alt);
  color: var(--text-muted);
  font-weight: 700;
  text-transform: uppercase;
  font-size: var(--font-xs);
  letter-spacing: 0.05em;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--surface-border);
  white-space: nowrap;
}

.table td {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--surface-border);
  vertical-align: middle;
}

.table tr:last-child td {
  border-bottom: none;
}

.table tr:hover td {
  background-color: var(--surface-alt);
}

.table-row-error {
  background-color: #fff1f2 !important;
  border-left: 4px solid var(--color-alpa);
}

.table-row-valid {
  background-color: #f0fdf4 !important;
  border-left: 4px solid var(--color-hadir);
}

/* ==========================================================================
   ATTENDANCE STATUS SELECTOR (MOBILE-FRIENDLY SEGMENTED CONTROLS)
   ========================================================================== */
.attendance-grid {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.attendance-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
  box-shadow: var(--shadow-sm);
}

.attendance-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-2);
}

.student-info {
  font-weight: 600;
  font-size: var(--font-sm);
  color: var(--text-main);
}
.student-nis {
  font-size: var(--font-xs);
  color: var(--text-muted);
  font-weight: normal;
}

.status-group {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-1);
  margin-bottom: var(--space-2);
}

.status-btn-label {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: var(--min-target);
  font-size: var(--font-sm);
  font-weight: 700;
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  cursor: pointer;
  background: var(--surface);
  color: var(--text-muted);
  transition: all 0.15s ease;
  user-select: none;
}

.status-radio {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* Checked styling per status */
.status-radio[value="Hadir"]:checked + .status-btn-label {
  background: var(--bg-hadir);
  color: var(--color-hadir);
  border-color: var(--color-hadir);
  box-shadow: 0 0 0 1px var(--color-hadir);
}

.status-radio[value="Izin"]:checked + .status-btn-label {
  background: var(--bg-izin);
  color: var(--color-izin);
  border-color: var(--color-izin);
  box-shadow: 0 0 0 1px var(--color-izin);
}

.status-radio[value="Sakit"]:checked + .status-btn-label {
  background: var(--bg-sakit);
  color: var(--color-sakit);
  border-color: var(--color-sakit);
  box-shadow: 0 0 0 1px var(--color-sakit);
}

.status-radio[value="Alpa"]:checked + .status-btn-label {
  background: var(--bg-alpa);
  color: var(--color-alpa);
  border-color: var(--color-alpa);
  box-shadow: 0 0 0 1px var(--color-alpa);
}

/* ==========================================================================
   MODAL DIALOG
   ========================================================================== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.6);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
  backdrop-filter: blur(2px);
}

.modal-backdrop:not(.open) {
  display: none !important;
}

.modal-backdrop.open:not([hidden]) {
  display: flex;
}

.modal-dialog {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  /* Bootstrap 5 .modal-dialog memakai pointer-events: none; secara bawaan.
     Gunakan !important agar modal dan seluruh isinya (input, tombol, close) bisa diklik */
  pointer-events: auto !important;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--surface-border);
  animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-dialog * {
  pointer-events: auto;
}

@keyframes modalPop {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.modal-header {
  padding: var(--space-4);
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-dialog > form {
  /* Form di antara header dan body: harus ikut flex agar body scroll dan footer terlihat */
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
}

.modal-body {
  padding: var(--space-4);
  overflow-y: auto;
  min-height: 0;
}

.modal-footer {
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--surface-border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-2);
  background: var(--surface-alt);
}

.btn-close {
  background: none;
  border: none;
  font-size: var(--font-xl);
  line-height: 1;
  color: var(--text-muted);
  cursor: pointer;
  padding: var(--space-1);
  min-width: 36px;
  min-height: 36px;
  display: flex;
