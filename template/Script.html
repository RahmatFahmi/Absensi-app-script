<script>
/**
 * Aplikasi Presensi Sekolah - Client Interaction Script (Vanilla JS)
 * Static Dashboard Template (No server calls / build framework)
 */

// State saat ini
const appState = {
  currentPage: 'login',
  currentRole: 'Guru',
  user: {
    name: 'Budi Pratama, S.Pd',
    nip_nis: '198205122008011003',
    role: 'Guru',
    detail: 'Guru Matematika'
  }
};

// Data pengguna simulasi per role
const demoUsers = {
  Admin: {
    name: 'Drs. Hendro Wibowo',
    nip_nis: '197503141999031002',
    role: 'Admin',
    detail: 'Administrator Presensi',
    avatar: 'HW',
    defaultPage: 'dashboard-admin'
  },
  Guru: {
    name: 'Budi Pratama, S.Pd',
    nip_nis: '198205122008011003',
    role: 'Guru',
    detail: 'Guru Matematika',
    avatar: 'BP',
    defaultPage: 'dashboard-guru'
  },
  Siswa: {
    name: 'Ahmad Dahlan',
    nip_nis: '1001',
    role: 'Siswa',
    detail: 'Kelas X-MIPA-1',
    avatar: 'AD',
    defaultPage: 'dashboard-siswa'
  }
};

/**
 * Inisialisasi saat DOM siap
 */
document.addEventListener('DOMContentLoaded', () => {
  // Tutup modal jika tombol Escape ditekan
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeAllModals();
      toggleSidebar(false);
    }
  });

  // Hitung status awal form presensi jika aktif
  updateAttendanceCounters();
});

/**
 * Navigasi antar halaman (show/hide section via data-page)
 * @param {string} pageId - ID halaman pada atribut data-page
 */
function navigateTo(pageId) {
  if (!pageId) return;

  const appFramework = document.getElementById('app-framework');
  const loginSection = document.getElementById('page-login');
  const quickJump = document.getElementById('quick-page-jump');

  if (pageId === 'login') {
    // Tampilkan halaman login, sembunyikan framework
    if (appFramework) {
      appFramework.style.display = 'none';
      appFramework.setAttribute('hidden', '');
    }
    if (loginSection) {
      loginSection.removeAttribute('hidden');
      loginSection.style.display = 'block';
      loginSection.classList.add('active');
    }
    appState.currentPage = 'login';
    if (quickJump) quickJump.value = 'login';
    return;
  }

  // Tampilkan framework aplikasi jika belum tampil
  if (loginSection) {
    loginSection.classList.remove('active');
    loginSection.setAttribute('hidden', '');
    loginSection.style.display = 'none';
  }
  if (appFramework) {
    appFramework.removeAttribute('hidden');
    appFramework.style.display = 'flex';
  }

  // Sembunyikan seluruh section halaman
  const pages = document.querySelectorAll('main.main-content .page');
  pages.forEach(p => {
    p.classList.remove('active');
    p.setAttribute('hidden', '');
  });

  // Aktifkan halaman target
  const targetPage = document.querySelector(`main.main-content .page[data-page="${pageId}"]`);
  if (targetPage) {
    targetPage.removeAttribute('hidden');
    targetPage.classList.add('active');
    appState.currentPage = pageId;
  }

  // Perbarui status menu navigasi aktif di sidebar
  const navItems = document.querySelectorAll('.sidebar-nav .nav-item');
  navItems.forEach(item => {
    if (item.getAttribute('data-target') === pageId) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });

  // Sinkronkan dropdown quick-jump
  if (quickJump) {
    quickJump.value = pageId;
  }

  // Tutup sidebar di tampilan mobile setelah klik
  toggleSidebar(false);

  // Scroll ke paling atas halaman
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/**
 * Simulasi pergantian role pengguna (Admin / Guru / Siswa)
 * @param {string} role - 'Admin' | 'Guru' | 'Siswa'
 */
function setRolePreview(role) {
  if (!demoUsers[role]) return;
  appState.currentRole = role;
  const profile = demoUsers[role];
  appState.user = { ...profile };

  // Perbarui badge role di topbar
  const topbarBadge = document.getElementById('topbar-role-badge');
  if (topbarBadge) {
    topbarBadge.textContent = role.toUpperCase();
  }

  // Perbarui data pengguna di footer sidebar
  const userNameEl = document.getElementById('sidebar-user-name');
  const userRoleEl = document.getElementById('sidebar-user-role');
  const userAvatarEl = document.getElementById('sidebar-avatar');

  if (userNameEl) userNameEl.textContent = profile.name;
  if (userRoleEl) userRoleEl.textContent = profile.detail;
  if (userAvatarEl) userAvatarEl.textContent = profile.avatar;

  // Tampilkan/sembunyikan grup menu di sidebar sesuai role
  const roleSections = document.querySelectorAll('.role-menu-section');
  roleSections.forEach(section => {
    const secRole = section.getAttribute('data-role-section');
    if (secRole === role) {
      section.style.display = 'block';
    } else {
      section.style.display = 'none';
    }
  });
}

/**
 * Penanganan submit form login
 */
function handleLoginSubmit() {
  const usernameInput = document.getElementById('login-username');
  const username = usernameInput ? usernameInput.value.trim().toLowerCase() : '';
  
  // Tentukan role pengguna berdasarkan username (untuk pratinjau lokal)
  let targetRole = appState.currentRole || 'Guru';
  if (username.includes('admin')) {
    targetRole = 'Admin';
  } else if (username.includes('siswa') || username === '1001' || (username.length <= 4 && !isNaN(username))) {
    targetRole = 'Siswa';
  } else if (username.includes('guru') || username.startsWith('19')) {
    targetRole = 'Guru';
  }
  
  setRolePreview(targetRole);
  showToast(`Selamat datang, ${demoUsers[targetRole]?.name || 'Pengguna'}!`, 'success');
  
  // Arahkan ke dashboard sesuai role
  navigateTo(demoUsers[targetRole]?.defaultPage || 'dashboard-guru');
}

/**
 * Simulasi keluar aplikasi (Logout)
 */
function logoutApp() {
  showToast('Anda telah keluar dari aplikasi.', 'info');
  navigateTo('login');
}

/**
 * Buka / tutup sidebar drawer mobile
 * @param {boolean} isOpen 
 */
function toggleSidebar(isOpen) {
  const sidebar = document.getElementById('app-sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  const closeBtn = document.getElementById('sidebar-close-btn');

  if (sidebar) {
    if (isOpen) {
      sidebar.classList.add('open');
      if (backdrop) backdrop.classList.add('open');
      if (closeBtn) closeBtn.style.display = 'flex';
    } else {
      sidebar.classList.remove('open');
      if (backdrop) backdrop.classList.remove('open');
      if (closeBtn) closeBtn.style.display = 'none';
    }
  }
}

/**
 * Buka modal berdasarkan ID
 * @param {string} modalId 
 */
function openModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.removeAttribute('hidden');
    modal.classList.add('open');
    // Beri fokus ke input pertama jika ada
    const firstInput = modal.querySelector('input, select, textarea');
    if (firstInput) firstInput.focus();
  }
}

/**
 * Tutup modal berdasarkan ID
 * @param {string} modalId 
 */
function closeModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.remove('open');
    modal.setAttribute('hidden', '');
  }
}

/**
 * Tutup seluruh modal yang sedang terbuka
 */
function closeAllModals() {
  const modals = document.querySelectorAll('.modal-backdrop');
  modals.forEach(m => {
    m.classList.remove('open');
    m.setAttribute('hidden', '');
  });
}

/**
 * Tampilkan notifikasi toast ringan
 * @param {string} message 
 * @param {string} type - 'success' | 'error' | 'info'
 */
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  
  let iconSvg = '';
  if (type === 'success') {
    iconSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-hadir); flex-shrink: 0;"><polyline points="20 6 9 17 4 12"/></svg>';
  } else if (type === 'error') {
    iconSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-alpa); flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
  } else {
    iconSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--primary); flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
  }

  toast.innerHTML = `
    ${iconSvg}
    <div style="flex: 1; min-width: 0;">${message}</div>
    <button type="button" class="btn-close" style="margin-left: var(--space-2);" onclick="this.parentElement.remove()" aria-label="Tutup">&times;</button>
  `;

  container.appendChild(toast);

  // Otomatis hapus setelah 4 detik
  setTimeout(() => {
    if (toast.parentElement) {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }
  }, 4000);
}

/**
 * Update realtime counter pada form presensi
 */
function updateAttendanceCounters() {
  const hadirCount = document.querySelectorAll('input.status-radio[value="Hadir"]:checked').length;
  const izinCount = document.querySelectorAll('input.status-radio[value="Izin"]:checked').length;
  const sakitCount = document.querySelectorAll('input.status-radio[value="Sakit"]:checked').length;
  const alpaCount = document.querySelectorAll('input.status-radio[value="Alpa"]:checked').length;

  const elHadir = document.getElementById('counter-hadir');
  const elIzin = document.getElementById('counter-izin');
  const elSakit = document.getElementById('counter-sakit');
  const elAlpa = document.getElementById('counter-alpa');

  if (elHadir) elHadir.textContent = hadirCount;
  if (elIzin) elIzin.textContent = izinCount;
  if (elSakit) elSakit.textContent = sakitCount;
  if (elAlpa) elAlpa.textContent = alpaCount;
}

/**
 * Tandai seluruh siswa menjadi 'Hadir' di Form Presensi
 */
function markAllHadir() {
  const hadirRadios = document.querySelectorAll('input.status-radio[value="Hadir"]');
  hadirRadios.forEach(radio => {
    radio.checked = true;
  });
  updateAttendanceCounters();
  showToast('Semua siswa ditandai Hadir.', 'info');
}

/**
 * Toggle kewajiban unggah file bukti pada pengajuan siswa
 * @param {string} jenis - 'Sakit' | 'Izin'
 */
function toggleBuktiRequirement(jenis) {
  const helper = document.getElementById('bukti-required-text');
  const fileInput = document.getElementById('pengajuan-file');
  if (!helper || !fileInput) return;

  if (jenis === 'Izin') {
    helper.innerHTML = '<span style="color: var(--color-alpa); font-weight: 700;">* Wajib surat orang tua bertanda tangan</span>';
    fileInput.required = true;
  } else {
    helper.textContent = '(Opsional saat pengajuan awal, bukti dokter dapat menyusul)';
    fileInput.required = false;
  }
}

/**
 * Isi contoh data paste pada halaman import
 */
function loadSamplePaste() {
  const area = document.getElementById('import-paste-area');
  if (area) {
    area.value = "1005\tEka Kurniawan\tX-MIPA-1\tTidak\n1001\tFajar Hidayat\tX-MIPA-99\tYa";
    showToast('Contoh data paste dimuat ke kotak teks.', 'info');
  }
}
</script>
